---
# Used for RHEL/CentOS/Fedora only. Allows the use of different repos.
redis_enablerepo: epel

redis_enabled: true

redis_port: 6379
redis_bind_interface: 127.0.0.1
redis_unixsocket: ''
redis_timeout: 300

redis_loglevel: "notice"
redis_logfile: /var/log/redis/redis-server.log

redis_databases: 16

# Set to an empty set to disable persistence (saving the DB to disk).
redis_save:
  - 900 1
  - 300 10
  - 60 10000

redis_rdbcompression: "yes"
redis_dbfilename: dump.rdb
redis_dbdir: /var/lib/redis

redis_maxmemory: 0
redis_maxmemory_policy: "noeviction"
redis_maxmemory_samples: 5

redis_appendonly: "no"
redis_appendfsync: "everysec"

# Add extra include files for local configuration/overrides.
redis_includes: []

# Require authentication to Redis with a password.
redis_requirepass: ""

# Optional replication defaults. Per-instance values take precedence.
redis_replicaof_host: ""
redis_masterauth: ""
redis_replica_read_only: "yes"

# Disable certain Redis commands for security reasons.
redis_disabled_commands: []
#  - FLUSHDB
#  - FLUSHALL
#  - KEYS
#  - PEXPIRE
#  - DEL
#  - CONFIG
#  - SHUTDOWN
#  - BGREWRITEAOF
#  - BGSAVE
#  - SAVE
#  - SPOP
#  - SREM
#  - RENAME
#  - DEBUG

redis_extra_config: ""

# Evaluated inside the per-instance loops. A loop result carries its whole
# item, so it has to be hidden whenever the instance itself holds a credential
# — a replica may carry only masterauth, with no password of its own.
redis_instance_has_credential: >-
  {{ (item.password | default('', true) | length > 0)
     or (item.masterauth | default('', true) | length > 0) }}

# Multi-instance configuration.
redis_instances: []
redis_conf_dir: /etc/redis
redis_runtime_dir: /run/redis
redis_log_dir: /var/log/redis
redis_data_dir: /var/lib/redis
redis_supervised: systemd
redis_daemonize: "no"
redis_disable_default_service: true
redis_healthcheck_retries: 12
redis_healthcheck_delay: 5

# Address the readiness checks connect to. Redis listens on
# redis_bind_interface, which is not necessarily a loopback address: bind one
# specific VLAN address and nothing answers on 127.0.0.1, so a hardcoded
# loopback check would time out on a perfectly healthy instance. A wildcard
# bind does cover loopback, so prefer loopback there and use the bound address
# otherwise. Override directly when the checks must take another route.
redis_bind_primary_address: "{{ (redis_bind_interface | string).split() | first | default('127.0.0.1', true) }}"
redis_healthcheck_host: >-
  {{ '127.0.0.1' if redis_bind_primary_address in ['0.0.0.0', '*', '127.0.0.1']
     else ('::1' if redis_bind_primary_address in ['::', '::0']
           else redis_bind_primary_address) }}
