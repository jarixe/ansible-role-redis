---
role_name_check: 1
dependency:
  name: galaxy
  options:
    ignore-errors: true
driver:
  name: docker
platforms:
  - name: primary
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    # A user-defined network, so the replica can resolve `primary` by name.
    # Docker's default bridge has no container-name DNS.
    networks:
      - name: redis
  - name: replica
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    # A user-defined network, so the replica can resolve `primary` by name.
    # Docker's default bridge has no container-name DNS.
    networks:
      - name: redis
provisioner:
  name: ansible
  # The role resolves by its directory name, which is the parent of the role
  # root — molecule does not put that on the roles path by itself.
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
