---
- name: Ensure Redis directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ redis_conf_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ redis_runtime_dir }}"
      owner: redis
      group: redis
      mode: "0755"
    - path: "{{ redis_log_dir }}"
      owner: redis
      group: redis
      mode: "0755"
    - path: "{{ redis_data_dir }}"
      owner: redis
      group: redis
      mode: "0750"

- name: Ensure Redis data directory exists per instance
  ansible.builtin.file:
    path: "{{ redis_data_dir }}/{{ item.name }}"
    state: directory
    owner: redis
    group: redis
    mode: "0750"
  loop: "{{ redis_instances_effective }}"
  loop_control:
    label: "{{ item.name }}"
  # The label only shortens the result header; the result body still carries
  # the whole item, password included, as soon as the play runs at -v.
  no_log: "{{ item.password | default(redis_requirepass) | length > 0 }}"

- name: Render Redis configuration per instance
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_conf_dir }}/{{ item.name }}.conf"
    owner: redis
    group: redis
    mode: "{{ redis_conf_mode }}"
  vars:
    redis_port: "{{ item.port }}"
    redis_instance_password: "{{ item.password | default(redis_requirepass) }}"
    redis_instance_maxmemory: "{{ item.maxmemory | default(redis_maxmemory) }}"
    redis_instance_maxmemory_policy: "{{ item.maxmemory_policy | default(redis_maxmemory_policy) }}"
    redis_instance_replicaof_host: "{{ item.replicaof_host | default(redis_replicaof_host) }}"
    redis_instance_replicaof_port: "{{ item.replicaof_port | default(item.port) }}"
    redis_instance_masterauth: >-
      {{ item.masterauth
         | default(redis_masterauth if redis_masterauth
                   else redis_instance_password) }}
    redis_dbdir: "{{ redis_data_dir }}/{{ item.name }}"
    redis_logfile: "{{ redis_log_dir }}/{{ item.name }}.log"
    redis_pidfile: "{{ redis_runtime_dir }}/redis-{{ item.name }}.pid"
  loop: "{{ redis_instances_effective }}"
  loop_control:
    label: "{{ item.name }}"
  diff: false
  no_log: true
  register: redis_instance_conf

- name: Render Redis systemd service per instance
  ansible.builtin.template:
    src: redis-instance.service.j2
    dest: "/etc/systemd/system/redis-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  vars:
    redis_instance_conf_path: "{{ redis_conf_dir }}/{{ item.name }}.conf"
    redis_instance: "{{ item }}"
  loop: "{{ redis_instances_effective }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: "{{ item.password | default(redis_requirepass) | length > 0 }}"
  register: redis_instance_unit
